name: 📦 Release & Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish @htunesys/hexawebshare to NPM
    runs-on: ubuntu-latest
    
    # Only run if tag is pushed from release/* branch
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Extract version from tag
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"
      
      # 3. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      # 4. Setup Node.js with NPM authentication
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: hexawebshare/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
      
      # 5. Install dependencies
      - name: Install dependencies
        working-directory: hexawebshare
        run: pnpm install --frozen-lockfile
      
      # 6. Full Quality Checks
      - name: TypeScript type check
        working-directory: hexawebshare
        run: pnpm check
      
      - name: Prettier format check
        working-directory: hexawebshare
        run: pnpm lint
      
      - name: Build library
        working-directory: hexawebshare
        run: pnpm build
      
      - name: Package validation
        working-directory: hexawebshare
        run: pnpm prepack
      
      # 7. Update package.json version
      - name: Update package version
        working-directory: hexawebshare
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          echo "✅ Updated package.json to version ${{ steps.version.outputs.version }}"
      
      # 8. Generate CHANGELOG
      - name: Install changelog generator
        run: npm install -g conventional-changelog-cli
      
      - name: Update CHANGELOG.md
        run: |
          conventional-changelog -p angular -i CHANGELOG.md -s
          echo "✅ CHANGELOG.md updated"
      
      # 9. Commit version bump and changelog
      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hexawebshare/package.json CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main || echo "No changes to push"
      
      # 10. Publish to NPM
      - name: Publish to NPM
        working-directory: hexawebshare
        run: |
          pnpm publish --no-git-checks --access public
          echo "✅ Published @htunesys/hexawebshare@${{ steps.version.outputs.version }} to NPM"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      # 11. Create GitHub Release
      - name: Generate release notes
        id: release_notes
        run: |
          echo "## 📦 hexaWebShare ${{ steps.version.outputs.tag }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Installation" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "pnpm add @htunesys/hexawebshare@${{ steps.version.outputs.version }}" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Links" >> release_notes.md
          echo "- 📦 NPM: https://www.npmjs.com/package/@htunesys/hexawebshare/v/${{ steps.version.outputs.version }}" >> release_notes.md
          echo "- 📖 Documentation: https://github.com/hTuneSys/hexaWebShare#readme" >> release_notes.md
          echo "- 📚 Storybook: https://htunesys.github.io/hexaWebShare/" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Changes" >> release_notes.md
          echo "See [CHANGELOG.md](https://github.com/hTuneSys/hexaWebShare/blob/main/CHANGELOG.md) for full details." >> release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 12. Summary
      - name: Job Summary
        run: |
          echo "## ✅ Release Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** @htunesys/hexawebshare" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 NPM Package" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/@htunesys/hexawebshare/v/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pnpm add @htunesys/hexawebshare@${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
